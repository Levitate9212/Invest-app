<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мой Портфель</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(26, 34, 52, 0.75) 0%, rgba(18, 24, 38, 0.85) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      background: rgba(15, 23, 42, 0.95);
    }
    .tab-active {
      color: #38bdf8 !important;
      position: relative;
    }
    .tab-active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }
    .shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body class="pb-28 select-none antialiased min-h-screen">
  <div class="p-4 max-w-md mx-auto space-y-4">

    <!-- Верхняя панель (Header) -->
    <div class="flex justify-between items-center pt-1">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight text-white leading-tight">Мой Портфель</h1>
          <p class="text-[11px] font-medium text-slate-400">Личные инвестиции</p>
        </div>
      </div>
      <button onclick="loadData(true)" id="refresh-btn" class="px-3 py-1.5 rounded-xl glass-card text-xs font-semibold text-slate-300 hover:text-white flex items-center gap-1.5 active:scale-95 transition">
        <svg id="refresh-icon" class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>Обновить</span>
      </button>
    </div>

    <!-- ================= ВКЛАДКА 1: СВОДКА ================= -->
    <div id="tab-summary" class="tab-view space-y-3.5">
      <!-- Главная карточка баланса -->
      <div class="glass-card p-5 rounded-3xl relative overflow-hidden shadow-2xl">
        <div class="absolute -right-8 -top-8 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>
        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Всего на счетах</span>
        <div id="val-worth" class="text-3xl font-black mt-1 text-white tracking-tight">0,00 ₽</div>
        
        <div class="flex items-center gap-2 mt-2.5">
          <div id="badge-profit" class="flex items-center gap-1 px-2.5 py-1 rounded-xl bg-emerald-500/15 border border-emerald-500/20 text-emerald-400 text-xs font-bold">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
            <span id="val-income">+0,00 ₽</span>
          </div>
          <div class="px-2 py-1 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">
            <span id="val-yield">+0.00%</span>
          </div>
        </div>
      </div>

      <!-- Вложено и Доход -->
      <div class="grid grid-cols-2 gap-2.5">
        <div class="glass-card p-3.5 rounded-2xl">
          <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Вложено</div>
          <div id="val-invested" class="text-base font-extrabold mt-1 text-white">0,00 ₽</div>
        </div>
        <div class="glass-card p-3.5 rounded-2xl">
          <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Чистый доход</div>
          <div id="val-profit" class="text-base font-extrabold mt-1 text-emerald-400">0,00 ₽</div>
        </div>
      </div>

      <!-- Структура активов -->
      <div class="glass-card p-4 rounded-2xl space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Структура активов</span>
          <span id="total-assets-count" class="text-xs text-slate-400 font-medium">0 позиций</span>
        </div>

        <!-- Визуальный Progress Bar -->
        <div class="w-full bg-slate-800/80 h-2.5 rounded-full overflow-hidden flex gap-0.5 p-0.5">
          <div id="bar-stocks" class="h-full bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full transition-all duration-700" style="width: 0%"></div>
          <div id="bar-bonds" class="h-full bg-gradient-to-r from-amber-500 to-orange-400 rounded-full transition-all duration-700" style="width: 0%"></div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-1">
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-md bg-blue-400 shadow-sm shadow-blue-400/50"></div>
            <div>
              <div class="text-xs text-slate-400">Акции</div>
              <div id="val-stocks-inv" class="text-xs font-bold text-white mt-0.5">0,00 ₽</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-md bg-amber-400 shadow-sm shadow-amber-400/50"></div>
            <div>
              <div class="text-xs text-slate-400">Облигации</div>
              <div id="val-bonds-inv" class="text-xs font-bold text-white mt-0.5">0,00 ₽</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= ВКЛАДКА 2: АКЦИИ ================= -->
    <div id="tab-stocks" class="tab-view hidden space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Акции в портфеле</h2>
        <span id="stocks-count" class="text-xs font-semibold text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded-lg">0 шт.</span>
      </div>
      <div id="stocks-list" class="space-y-2.5"></div>
    </div>

    <!-- ================= ВКЛАДКА 3: ОБЛИГАЦИИ ================= -->
    <div id="tab-bonds" class="tab-view hidden space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Облигации в портфеле</h2>
        <span id="bonds-count" class="text-xs font-semibold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-lg">0 шт.</span>
      </div>
      <div id="bonds-list" class="space-y-2.5"></div>
    </div>

    <!-- ================= ВКЛАДКА 4: ДОБАВИТЬ СДЕЛКУ ================= -->
    <div id="tab-add" class="tab-view hidden glass-card p-5 rounded-3xl shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-extrabold text-white">Новая сделка</h2>
        <span class="text-xs text-slate-400">В таблицу Google</span>
      </div>

      <!-- Segmented Control -->
      <div class="flex p-1 bg-slate-900/90 rounded-2xl border border-slate-800">
        <button onclick="setAddType('stock')" id="btn-add-stock" class="flex-1 py-2 rounded-xl bg-blue-600 text-white font-bold text-xs shadow-md transition">Акции</button>
        <button onclick="setAddType('bond')" id="btn-add-bond" class="flex-1 py-2 rounded-xl text-slate-400 font-bold text-xs transition">Облигации</button>
      </div>

      <!-- Форма Акции -->
      <div id="form-stock" class="space-y-3">
        <div>
          <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Тикер инструмента</label>
          <input id="in-stock-ticker" placeholder="например SBER или LKOH" class="w-full p-3 rounded-xl glass-input text-sm font-semibold mt-1">
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Количество</label>
            <input id="in-stock-qty" type="number" placeholder="10 шт." class="w-full p-3 rounded-xl glass-input text-sm font-semibold mt-1">
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Цена за шт.</label>
            <input id="in-stock-price" type="number" step="0.01" placeholder="280.50 ₽" class="w-full p-3 rounded-xl glass-input text-sm font-semibold mt-1">
          </div>
        </div>
      </div>

      <!-- Форма Облигации -->
      <div id="form-bond" class="space-y-3 hidden">
        <div>
          <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Название выпуска</label>
          <input id="in-bond-name" placeholder="например ОФЗ 26246" class="w-full p-3 rounded-xl glass-input text-sm font-semibold mt-1">
        </div>
        <div>
          <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Дата погашения</label>
          <input id="in-bond-date" type="date" class="w-full p-3 rounded-xl glass-input text-sm font-semibold mt-1">
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Количество</label>
            <input id="in-bond-qty" type="number" placeholder="10 шт." class="w-full p-3 rounded-xl glass-input text-sm font-semibold mt-1">
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Цена покупки</label>
            <input id="in-bond-price" type="number" step="0.01" placeholder="880.64 ₽" class="w-full p-3 rounded-xl glass-input text-sm font-semibold mt-1">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Купон (руб.)</label>
            <input id="in-bond-coupon" type="number" step="0.01" placeholder="59.84 ₽" class="w-full p-3 rounded-xl glass-input text-sm font-semibold mt-1">
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">НКД при покупке</label>
            <input id="in-bond-nkd" type="number" step="0.01" placeholder="0 ₽" value="0" class="w-full p-3 rounded-xl glass-input text-sm font-semibold mt-1">
          </div>
        </div>
      </div>

      <button id="btn-save" onclick="saveTransaction()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-500/25 active:scale-98 transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
        <span>Записать в таблицу</span>
      </button>
      <div id="save-status" class="text-center text-xs hidden font-bold"></div>
    </div>

  </div>

  <!-- Нижняя панель навигации (Dock Bar) -->
  <nav class="fixed bottom-3 left-4 right-4 max-w-md mx-auto glass-card rounded-3xl border border-white/10 px-3 py-2 flex justify-around items-center text-[11px] font-bold z-50 shadow-2xl backdrop-blur-xl">
    <button onclick="setTab('summary')" id="b-summary" class="flex flex-col items-center gap-1 text-slate-400 py-1 transition tab-active">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 4h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>Сводка</span>
    </button>
    <button onclick="setTab('stocks')" id="b-stocks" class="flex flex-col items-center gap-1 text-slate-400 py-1 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
      <span>Акции</span>
    </button>
    <button onclick="setTab('bonds')" id="b-bonds" class="flex flex-col items-center gap-1 text-slate-400 py-1 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span>Облигации</span>
    </button>
    <button onclick="setTab('add')" id="b-add" class="flex flex-col items-center gap-1 text-slate-400 py-1 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Добавить</span>
    </button>
  </nav>

  <script>
    // ==========================================
    // ВАША ССЫЛКА НА GOOGLE APPS SCRIPT:
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcvhsjeidMICS9pYLVjINAXGNCqQGi3Qu7IVL_SpxNjgMCR6p2xdCvDguSTaJEwb5x/exec"; 

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0b0f19');
      tg.setBackgroundColor('#0b0f19');
    }

    let currentAddType = "stock";

    // Форматирование валюты строго до 2 знаков: 8 832,79 ₽
    function formatRub(val) {
      return Number(val || 0).toLocaleString('ru-RU', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + ' ₽';
    }

    function triggerHaptic(type = "light") {
      if (!tg?.HapticFeedback) return;
      if (type === "success") tg.HapticFeedback.notificationOccurred("success");
      else tg.HapticFeedback.impactOccurred("light");
    }

    function setTab(name) {
      triggerHaptic("light");
      document.querySelectorAll('.tab-view').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + name).classList.remove('hidden');

      ['summary', 'stocks', 'bonds', 'add'].forEach(t => {
        const btn = document.getElementById('b-' + t);
        if (t === name) {
          btn.classList.add('tab-active');
          btn.classList.remove('text-slate-400');
        } else {
          btn.classList.remove('tab-active');
          btn.classList.add('text-slate-400');
        }
      });
    }

    function setAddType(type) {
      triggerHaptic("light");
      currentAddType = type;
      document.getElementById('form-stock').classList.toggle('hidden', type !== 'stock');
      document.getElementById('form-bond').classList.toggle('hidden', type !== 'bond');

      if (type === 'stock') {
        document.getElementById('btn-add-stock').className = "flex-1 py-2 rounded-xl bg-blue-600 text-white font-bold text-xs shadow-md transition";
        document.getElementById('btn-add-bond').className = "flex-1 py-2 rounded-xl text-slate-400 font-bold text-xs transition";
      } else {
        document.getElementById('btn-add-bond').className = "flex-1 py-2 rounded-xl bg-amber-600 text-white font-bold text-xs shadow-md transition";
        document.getElementById('btn-add-stock').className = "flex-1 py-2 rounded-xl text-slate-400 font-bold text-xs transition";
      }
    }

    async function loadData(manual = false) {
      if (manual) triggerHaptic("light");
      const icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.add('animate-spin');

      try {
        const res = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
        const data = await res.json();
        const s = data.summary;

        // 1. Сводка
        document.getElementById('val-worth').innerText = formatRub(s.totalWorth);
        document.getElementById('val-invested').innerText = formatRub(s.invested);
        document.getElementById('val-income').innerText = (s.income >= 0 ? '+' : '') + formatRub(s.income);
        document.getElementById('val-profit').innerText = formatRub(s.income);
        document.getElementById('val-yield').innerText = (s.totalYield >= 0 ? '+' : '') + Number(s.totalYield).toFixed(2) + '%';
        document.getElementById('val-stocks-inv').innerText = formatRub(s.stocksInv);
        document.getElementById('val-bonds-inv').innerText = formatRub(s.bondsInv);

        // Расчет процентов долей
        const total = (Number(s.stocksInv) + Number(s.bondsInv)) || 1;
        const stocksPct = Math.round((Number(s.stocksInv) / total) * 100);
        const bondsPct = Math.round((Number(s.bondsInv) / total) * 100);

        document.getElementById('bar-stocks').style.width = (s.stocksInv > 0 ? Math.max(stocksPct, 4) : 0) + '%';
        document.getElementById('bar-bonds').style.width = (s.bondsInv > 0 ? Math.max(bondsPct, 4) : 0) + '%';
        document.getElementById('total-assets-count').innerText = `${data.stocks.length + data.bonds.length} поз.`;

        // 2. Акции
        document.getElementById('stocks-count').innerText = `${data.stocks.length} поз.`;
        const sl = document.getElementById('stocks-list');
        sl.innerHTML = data.stocks.length ? '' : '<div class="text-xs text-slate-500 text-center py-12 glass-card rounded-2xl">Акции пока не внесены</div>';
        data.stocks.forEach(st => {
          const initials = st.ticker.substring(0, 2).toUpperCase();
          sl.innerHTML += `
            <div class="glass-card p-3.5 rounded-2xl flex justify-between items-center">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-500/15 border border-blue-500/20 text-blue-400 font-extrabold text-xs flex items-center justify-center">
                  ${initials}
                </div>
                <div>
                  <div class="font-extrabold text-sm text-white">${st.ticker}</div>
                  <div class="text-[11px] text-slate-400 font-medium">${st.quantity} шт. × ${formatRub(st.buyPrice)}</div>
                </div>
              </div>
              <div class="text-right">
                <div class="font-extrabold text-sm text-white">${formatRub(st.curCost)}</div>
                <div class="text-xs font-bold ${st.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                  ${st.pnl >= 0 ? '+' : ''}${formatRub(st.pnl)} (${st.pnlPct.toFixed(1)}%)
                </div>
              </div>
            </div>`;
        });

        // 3. Облигации
        document.getElementById('bonds-count').innerText = `${data.bonds.length} поз.`;
        const bl = document.getElementById('bonds-list');
        bl.innerHTML = data.bonds.length ? '' : '<div class="text-xs text-slate-500 text-center py-12 glass-card rounded-2xl">Облигации пока не внесены</div>';
        data.bonds.forEach(bd => {
          bl.innerHTML += `
            <div class="glass-card p-3.5 rounded-2xl flex justify-between items-center">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/15 border border-amber-500/20 text-amber-400 font-extrabold text-xs flex items-center justify-center">
                  ОФЗ
                </div>
                <div>
                  <div class="font-extrabold text-sm text-white">${bd.name}</div>
                  <div class="text-[11px] text-slate-400 font-medium">${bd.quantity} шт. · Купон ${bd.coupon} ₽</div>
                </div>
              </div>
              <div class="text-right">
                <div class="font-extrabold text-sm text-white">${formatRub(bd.totalSpent)}</div>
                <div class="text-xs text-amber-400 font-extrabold">${bd.yieldNet.toFixed(1)}% год. (НДФЛ)</div>
              </div>
            </div>`;
        });

        if (manual) triggerHaptic("success");

      } catch (err) {
        console.error("Ошибка загрузки:", err);
      } finally {
        if (icon) icon.classList.remove('animate-spin');
      }
    }

    async function saveTransaction() {
      const btn = document.getElementById('btn-save');
      const status = document.getElementById('save-status');

      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> <span>Сохранение...</span>`;
      status.classList.remove('hidden');
      status.innerText = "Запись в Google Таблицу...";
      status.className = "text-center text-xs text-slate-400";

      let payload = { type: currentAddType };

      if (currentAddType === "stock") {
        payload.ticker = document.getElementById('in-stock-ticker').value.trim();
        payload.quantity = document.getElementById('in-stock-qty').value;
        payload.price = document.getElementById('in-stock-price').value;
        if (!payload.ticker || !payload.quantity || !payload.price) {
          alert("Заполните все поля акции!");
          btn.disabled = false;
          btn.innerHTML = `Записать в таблицу`;
          status.classList.add('hidden');
          return;
        }
      } else {
        payload.name = document.getElementById('in-bond-name').value.trim();
        payload.matDate = document.getElementById('in-bond-date').value;
        payload.quantity = document.getElementById('in-bond-qty').value;
        payload.price = document.getElementById('in-bond-price').value;
        payload.coupon = document.getElementById('in-bond-coupon').value;
        payload.nkd = document.getElementById('in-bond-nkd').value || 0;
        payload.freq = 2;
        if (!payload.name || !payload.quantity || !payload.price) {
          alert("Заполните основные поля облигации!");
          btn.disabled = false;
          btn.innerHTML = `Записать в таблицу`;
          status.classList.add('hidden');
          return;
        }
      }

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        triggerHaptic("success");
        status.innerText = "✅ Успешно записано!";
        status.className = "text-center text-xs text-emerald-400 font-bold";

        setTimeout(() => {
          setTab('summary');
          loadData();
          btn.disabled = false;
          btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg> <span>Записать в таблицу</span>`;
          status.classList.add('hidden');
        }, 1200);

      } catch (err) {
        status.innerText = "❌ Ошибка сохранения";
        status.className = "text-center text-xs text-rose-500 font-bold";
        btn.disabled = false;
        btn.innerHTML = `Записать в таблицу`;
      }
    }

    window.addEventListener('DOMContentLoaded', () => loadData());
  </script>
</body>
</html>
